<div id="app">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="ground"></div>

  <!-- HOME -->
  <section id="scr-home" class="screen">
    <div class="hud">
      <button class="pbtn sm ghost" id="btn-parent" aria-label="Для взрослых"><img class="spr" data-spr="i_gear" alt=""></button>
      <div class="gemcount" aria-label="Алмазы"><img class="spr" data-spr="gem" alt=""><b>0</b></div>
    </div>
    <div class="home-main">
      <div class="logo">
        <div class="logo-top" id="logo-name">СУПЕР-МАКС</div>
        <div class="logo-sub">ОХОТА ЗА БУКВАМИ</div>
      </div>
      <div class="home-row">
        <button class="hero-big" id="home-hero" aria-label="Герой"><img class="spr float" id="home-hero-img" data-spr="hero" alt=""></button>
        <div class="home-actions">
          <button class="pbtn play pulse" id="btn-play"><img class="spr" data-spr="i_play" alt=""><span>ИГРАТЬ</span></button>
          <div class="tiles">
            <button class="pbtn tile" data-go="abc" style="--c:var(--sun)"><img class="spr" data-spr="i_book" alt=""><span>Азбука</span></button>
            <button class="pbtn tile" data-go="write" style="--c:var(--grass)"><img class="spr" data-spr="i_pencil" alt=""><span>Пропись</span></button>
            <button class="pbtn tile" data-go="tir" style="--c:var(--hero)"><img class="spr" data-spr="i_target" alt=""><span>Тир</span></button>
            <button class="pbtn tile" data-go="build" style="--c:var(--glitch)"><img class="spr" data-spr="i_castle" alt=""><span>Стройка</span></button>
            <button class="pbtn tile" id="tile-heroes" data-go="heroes" style="--c:var(--cape)"><img class="spr" data-spr="i_crown" alt=""><span>Герои</span><i class="badge">!</i></button>
            <button class="pbtn tile" data-go="tanks" style="--c:var(--good)"><img class="spr" data-spr="i_tank" alt=""><span>Танчики</span></button>
          </div>
        </div>
      </div>
    </div>
    <div class="pets" id="pets">
      <button class="pet p-vinni" data-pet="vinni" aria-label="Винни"><img class="spr" data-spr="dog_vinni" alt=""></button>
      <button class="pet p-elli" data-pet="elli" aria-label="Элли"><img class="spr" data-spr="dog_elli" alt=""></button>
      <button class="pet p-baby" data-pet="baby" aria-label="Даниил"><img class="spr" data-spr="baby" alt=""></button>
      <button class="pet p-gerda" data-pet="gerda" aria-label="Герда"><img class="spr kennel" data-spr="kennel" alt=""><img class="spr" data-spr="dog_gerda" alt=""></button>
    </div>
    <button class="peek" id="peek" aria-label="Глюк"><img class="spr glitchy" data-spr="glitch" alt=""></button>
  </section>

  <!-- GAME -->
  <section id="scr-game" class="screen" hidden>
    <div class="hud">
      <button class="pbtn sm" id="btn-exit" aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      <div class="boss" id="boss"><img class="spr boss-img glitchy" id="boss-img" data-spr="glitch" alt=""><div class="hp" id="hp"></div></div>
      <div class="scr-title free-title" id="free-title" hidden></div>
      <div class="gemcount"><img class="spr" data-spr="gem" alt=""><b>0</b></div>
    </div>
    <div id="stage" class="stage"></div>
  </section>

  <!-- REWARD -->
  <section id="scr-reward" class="screen" hidden>
    <div class="rw">
      <div class="rw-title" id="rw-title">ПОБЕДА!</div>
      <div class="rw-scene">
        <button class="rw-dog" data-pet="vinni" aria-label="Винни"><img class="spr" data-spr="dog_vinni" alt=""></button>
        <img class="spr rw-hero float" data-spr="hero" alt="">
        <button class="rw-dog d2" data-pet="elli" aria-label="Элли"><img class="spr" data-spr="dog_elli" alt=""></button>
        <div class="rw-gems"><img class="spr" data-spr="gem" alt=""><b id="rw-n">+0</b></div>
        <img class="spr rw-glitch" data-spr="glitch" alt="">
      </div>
      <div class="rw-letters" id="rw-letters"></div>
      <div class="rw-actions">
        <button class="pbtn big pulse" id="rw-build" style="--c:var(--glitch)"><img class="spr" data-spr="i_castle" alt=""><span>Строить</span></button>
        <button class="pbtn big" id="rw-again" style="--c:var(--hero)"><img class="spr" data-spr="i_play" alt=""><span>Ещё</span></button>
        <button class="pbtn big" id="rw-heroes" hidden style="--c:var(--cape)"><img class="spr" data-spr="i_crown" alt=""><span>Герои</span></button>
        <button class="pbtn big" id="rw-home" aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      </div>
    </div>
  </section>

  <!-- BUILD -->
  <section id="scr-build" class="screen" hidden>
    <div class="hud">
      <button class="pbtn sm" data-home aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      <div class="build-title"><span class="scr-title" id="build-name">СТРОЙКА</span><div class="bar" id="build-barw" hidden><i id="build-bar"></i></div><span class="build-count" id="build-count" hidden>0/0</span></div>
      <button class="pbtn sm" id="btn-plan" aria-label="Что строим" style="--c:var(--sun)"><img class="spr" data-spr="i_plan" alt=""></button>
      <button class="pbtn sm pulse" id="build-play" aria-label="Играть" style="--c:var(--hero)" hidden><img class="spr" data-spr="i_play" alt=""></button>
      <div class="gemcount"><img class="spr" data-spr="gem" alt=""><b>0</b></div>
    </div>
    <div class="build-stage" id="build-stage"><canvas id="build-cv"></canvas><div class="bdogs" id="bdogs"></div></div>
    <div class="hotbar" id="hotbar"></div>
  </section>

  <!-- TANKS -->
  <section id="scr-tanks" class="screen" hidden>
    <div class="hud">
      <button class="pbtn sm" data-home aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      <div class="tk-top">
        <div class="bubble tk-target"><span class="ptext">Подбей</span><span class="tgt" id="tk-letter">А</span><button class="pbtn" id="tk-say" aria-label="Повторить" style="--c:var(--cape)"><img class="spr" data-spr="i_sound" alt=""></button></div>
        <div class="stars" id="tk-stars"></div>
        <div class="tk-lives" id="tk-lives"></div>
        <div class="lvl" id="tk-lvl">УР. 1</div>
      </div>
      <div class="gemcount"><img class="spr" data-spr="gem" alt=""><b>0</b></div>
    </div>
    <div class="tk-stage">
      <div class="tk-pad" id="tk-pad" aria-label="Руль"><i class="ar u"></i><i class="ar r"></i><i class="ar d"></i><i class="ar l"></i><i class="knob"></i></div>
      <div class="tk-arena" id="tk-arena"><canvas id="tk-cv"></canvas><div class="tk-over" id="tk-over" hidden></div></div>
      <button class="tk-fire" id="tk-fire" aria-label="Огонь"><img class="spr" data-spr="i_target" alt=""></button>
    </div>
  </section>

  <!-- ABC / WRITE -->
  <section id="scr-abc" class="screen" hidden>
    <div class="hud">
      <button class="pbtn sm" data-home aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      <div class="scr-title" id="abc-title">АЗБУКА</div>
      <div class="gemcount"><img class="spr" data-spr="gem" alt=""><b>0</b></div>
    </div>
    <div class="abc-wrap"><div class="abc-grid" id="abc-grid"></div></div>
  </section>

  <!-- HEROES -->
  <section id="scr-heroes" class="screen" hidden>
    <div class="hud">
      <button class="pbtn sm" data-home aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      <div class="scr-title">ГЕРОИ</div>
      <div class="gemcount"><img class="spr" data-spr="gem" alt=""><b>0</b></div>
    </div>
    <div class="abc-wrap"><div class="hero-grid" id="hero-grid"></div></div>
  </section>

  <!-- PARENT -->
  <section id="scr-parent" class="screen" hidden>
    <div class="hud">
      <button class="pbtn sm" data-home aria-label="Домой"><img class="spr" data-spr="i_home" alt=""></button>
      <div class="scr-title">ДЛЯ РОДИТЕЛЕЙ</div>
      <div style="width:54px"></div>
    </div>
    <div class="parent-wrap"><div class="parent panel" id="parent"></div></div>
  </section>
</div>

<div id="modal" class="modal" hidden><div class="modal-box panel" id="modal-box"></div></div>
<canvas id="fx"></canvas>
<div id="fxl"></div>
